<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e6fd9">
<title>RDO Digital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>RDO Digital <span id="statusSalvo" class="save-status">✔ Salvo no celular</span></h1>
<p class="sub">Preencha os campos, escolha as fotos e compartilhe</p>

<div class="container">
  <div class="grid-2">
    <div>
      <label>Data</label>
      <input type="date" id="inpData" class="auto-save">
    </div>
    <div>
      <label>Horário</label>
      <input type="text" id="inpHorario" value="07:00–18:00" class="auto-save">
    </div>
  </div>

  <div class="grid-2">
    <div>
      <label>FA</label>
      <input type="text" id="inpFA" value="1968" class="auto-save">
    </div>
    <div>
      <label>Local/Setor</label>
      <input type="text" id="inpLocal" value="GMB/SJC – Família 01" class="auto-save">
    </div>
  </div>

  <h2>Atividades</h2>
  <label>Mecânica (uma por linha)</label>
  <textarea id="inpMecanica" class="auto-save">Montagem de dutos e módulos do resfriamento
Carreg./descarreg. e posicionamento de materiais e equipamentos
Elevação de peças, dutos e estrutura metálica
Montagem, desmontagem e ajustes da estufa, transportador, correntes e portas</textarea>

  <label>Elétrica (uma por linha)</label>
  <textarea id="inpEletrica" class="auto-save">Instalação de infra elétrica</textarea>

  <h2>Equipe e Liderança</h2>
  <label>Liderança Falcare</label>
  <input type="text" id="inpLideranca" value="Rafael Barbosa / Kleber Calixto" class="auto-save">

  <label>Equipe (uma por linha)</label>
  <textarea id="inpEquipe" class="auto-save">Sup. Falcare – 02
RB Soluções TST – 01
RB Soluções Mecânica – 02
Torqumec – 04
Evastec – 12</textarea>

  <h2>Serviço a Quente</h2>
  <div class="grid-2">
    <div>
      <label>Chamado / Atendimento</label>
      <input type="text" id="inpHorarioQuente" value="Chamado: 08:05 | Atendimento: 08:30" class="auto-save">
    </div>
    <div>
      <label>Bombeiro / Empresa</label>
      <input type="text" id="inpBombeiro" value="Jonathan – RB Soluções" class="auto-save">
    </div>
  </div>

  <h2>Equipamentos e Segurança</h2>
  <label>Equipamentos (uma por linha)</label>
  <textarea id="inpEquipamentos" class="auto-save">Plataforma elevatória
Ferramentas manuais
Máquina de solda
Empilhadeira
Lixadeira</textarea>

  <label>Segurança (uma por linha)</label>
  <textarea id="inpSeguranca" class="auto-save">Colaboradores orientados ao uso de biombo (lixadeira) e luvas
5S realizado na área
DDS realizado</textarea>

  <h2>Anexos de Fotos</h2>
  <div class="grid-2">
    <div>
      <label>Foto do DDS</label>
      <div class="foto-box">
        <label for="fileDDS" class="foto-label">📷 Escolher DDS</label>
        <input type="file" id="fileDDS" accept="image/*" onchange="previewImagem(this, 'imgDDS', 'nomeDDS')">
        <img id="imgDDS" class="foto-preview" alt="Preview DDS">
        <div id="nomeDDS" class="file-name">✔ DDS anexado</div>
      </div>
    </div>

    <div>
      <label>Foto do Isolamento</label>
      <div class="foto-box">
        <label for="fileIsolamento" class="foto-label">📷 Escolher Isolamento</label>
        <input type="file" id="fileIsolamento" accept="image/*" onchange="previewImagem(this, 'imgIsolamento', 'nomeIsolamento')">
        <img id="imgIsolamento" class="foto-preview" alt="Preview Isolamento">
        <div id="nomeIsolamento" class="file-name">✔ Isolamento anexado</div>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <label>Resultado do RDO</label>
  <textarea id="resultado" style="min-height: 300px; background: #f9f9f9; font-size: 12px;" readonly></textarea>

  <button class="btn btn-zap" onclick="enviarTudo()">📲 Compartilhar RDO + Fotos</button>
  <button class="btn btn-copy" onclick="copiarTexto()">📋 Copiar Apenas o Texto</button>
  <button class="btn btn-save" onclick="baixarArquivo()">💾 Salvar RDO no Celular</button>
</div>

<script src="app.js"></script>
</body>
</html>
